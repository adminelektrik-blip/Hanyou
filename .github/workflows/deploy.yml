
# Satu workflow untuk dua hal:
#  - Pull Request  → dibuatkan link PREVIEW (kedaluwarsa 7 hari) untuk dicek sebelum di-ACC
#  - Merge ke main → otomatis tayang LIVE di https://hanyou-app.web.app
name: Deploy Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: hanyou-app
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
          expires: 7d
